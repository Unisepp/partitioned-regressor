[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "partitioned-regressor"
version = "0.3.0"
description = "CART-partitioned regression (AutoGluon, CatBoost, XGBoost, LightGBM, random forest, linear) with an automatic hyperparameter search."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "autogluon.tabular[all]",
    "catboost",
    "xgboost",
    "lightgbm",
    "scikit-learn>=1.2",
    "pandas",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/partitioned_regressor"]
